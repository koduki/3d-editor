name: CI / CD

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENVSCODE_VERSION: "1.109.5"
  OPENVSCODE_X64_SHA256: "b433bf4f0227321a7014d8460d10a8f958adc0f45aa79bd889e84e65e8f88363"

jobs:
  android-apk:
    name: KuCode APK Build (PRoot + Debian + OpenVSCode)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      has_release: ${{ steps.release_build.outputs.has_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK API 36 Platform & NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          if [[ ! -d "$ANDROID_HOME/ndk" ]] || [[ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]]; then
            "$SDKMANAGER" "ndk;27.2.12479018"
          fi
          ls -la "$ANDROID_HOME/ndk"

      - name: Cache Built PRoot Binaries (arm64-v8a)
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a
          key: proot-arm64-${{ hashFiles('scripts/build-proot-android.sh') }}

      - name: Build PRoot + Loader for Android arm64-v8a
        run: ./scripts/build-proot-android.sh

      - name: Cache Embedded Runtime Archives (Debian + OpenVSCode)
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/runtime
          key: runtime-assets-${{ env.OPENVSCODE_VERSION }}-${{ hashFiles('scripts/fetch-runtime-assets.sh') }}

      - name: Fetch Debian Minimal Rootfs & OpenVSCode Server
        run: ./scripts/fetch-runtime-assets.sh

      - name: Exercise extension & native diagnostics with matching OpenVSCode on the Linux runner
        run: |
          tag="openvscode-server-v${OPENVSCODE_VERSION}"
          archive="$RUNNER_TEMP/${tag}-linux-x64.tar.gz"
          server="$RUNNER_TEMP/kucode-openvscode-linux"
          mkdir -p "$server"
          curl -fsSL --retry 3 "https://github.com/gitpod-io/openvscode-server/releases/download/$tag/$tag-linux-x64.tar.gz" -o "$archive"
          echo "${OPENVSCODE_X64_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$server" --strip-components=1
          rm -f "$archive"
          "$server/node" --check android/app/src/main/assets/runtime-probes.cjs
          "$server/node" --check android/app/src/main/assets/kucode-tools/extension.js
          KUCODE_NATIVE_MODULES="$server/node_modules" "$server/node" --test tests/runtime-probes.test.cjs tests/kucode-extension.test.cjs

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Small & Medium Unit Tests and Build Debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:testDebugMediumUnitTest :app:assembleDebug --stacktrace

      - name: Verify Embedded Runtime, Extension & License Notices Inside Debug APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          unzip -p "$APK" assets/runtime-probes.cjs | cmp - android/app/src/main/assets/runtime-probes.cjs
          unzip -p "$APK" assets/kucode-tools/extension.js | cmp - android/app/src/main/assets/kucode-tools/extension.js
          unzip -p "$APK" assets/kucode-tools/package.json | cmp - android/app/src/main/assets/kucode-tools/package.json
          unzip -p "$APK" assets/kucode-tools/icon.svg | cmp - android/app/src/main/assets/kucode-tools/icon.svg
          unzip -l "$APK" | grep -E "libproot\.so|libproot-loader\.so|debian-arm64-rootfs\.tgz|openvscode-server-linux-arm64\.tgz|boot\.html|assets/kucode-tools/|assets/licenses/"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libproot.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libproot-loader.so"
          unzip -l "$APK" | grep -q "assets/runtime/debian-arm64-rootfs.tgz"
          unzip -l "$APK" | grep -q "assets/runtime/openvscode-server-linux-arm64.tgz"
          unzip -l "$APK" | grep -q "assets/kucode-tools/extension.js"
          unzip -l "$APK" | grep -q "assets/kucode-tools/package.json"
          unzip -l "$APK" | grep -q "assets/kucode-tools/icon.svg"
          unzip -l "$APK" | grep -q "assets/licenses/LICENSE"
          unzip -l "$APK" | grep -q "assets/licenses/THIRD_PARTY_NOTICES.md"
          unzip -l "$APK" | grep -q "assets/licenses/GPL-3.0.txt"
          unzip -l "$APK" | grep -q "assets/licenses/GPL-2.0.txt"
          unzip -l "$APK" | grep -q "assets/licenses/LGPL-3.0.txt"
          unzip -l "$APK" | grep -q "assets/licenses/Apache-2.0.txt"
          unzip -l "$APK" | grep -q "assets/licenses/debian-manifest.txt"
          mkdir -p dist-apk
          cp "$APK" "dist-apk/kucode-debug.apk"
          cp "android/app/src/main/assets/runtime/debian-manifest.txt" "dist-apk/debian-manifest.txt"
          cp "THIRD_PARTY_NOTICES.md" "dist-apk/THIRD_PARTY_NOTICES.md"
          ls -lh dist-apk/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kucode-debug-apk
          path: dist-apk/kucode-debug.apk
          retention-days: 30

      - name: Upload License Notices & Debian Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kucode-notices
          path: |
            dist-apk/debian-manifest.txt
            dist-apk/THIRD_PARTY_NOTICES.md
          retention-days: 90

      - name: Build Signed Release APK & AAB (when signing secrets are configured)
        id: release_build
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing keystore secret configured; skipping signed release build."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.keystore"
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/kucode-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist-apk/kucode-release.aab
          echo "has_release=true" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Release Artifact
        if: steps.release_build.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kucode-release-bundle
          path: |
            dist-apk/kucode-release.apk
            dist-apk/kucode-release.aab
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: android-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: kucode-debug-apk
          path: release-files

      - name: Download License Notices & Debian Manifest
        uses: actions/download-artifact@v4
        with:
          name: kucode-notices
          path: release-files

      - name: Download Signed Release Bundle
        if: needs.android-apk.outputs.has_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: kucode-release-bundle
          path: release-files

      - name: Publish GitHub Release on v* tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES=(release-files/debian-manifest.txt release-files/THIRD_PARTY_NOTICES.md)
          if [ -f release-files/kucode-release.apk ]; then
            FILES+=(release-files/kucode-release.apk release-files/kucode-release.aab)
          fi
          FILES+=(release-files/kucode-debug.apk)
          gh release create "$TAG" "${FILES[@]}" \
            --title "KuCode $TAG" \
            --generate-notes || \
          gh release upload "$TAG" "${FILES[@]}" --clobber
