name: CI / CD

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  OPENVSCODE_VERSION: "1.109.5"
  OPENVSCODE_X64_SHA256: "b433bf4f0227321a7014d8460d10a8f958adc0f45aa79bd889e84e65e8f88363"

jobs:
  android-apk:
    name: KuCode APK Build (PRoot + Debian + OpenVSCode)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      has_release: ${{ steps.release_build.outputs.has_release }}
      bootstrap_runtime: ${{ steps.runtime_source.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Select runtime asset source
        id: runtime_source
        run: |
          if [[ -f runtime-assets.lock.json ]]; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Android SDK API 36 Platform & NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          if [[ ! -f runtime-assets.lock.json ]]; then
            "$SDKMANAGER" "ndk;27.2.12479018"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          fi

      - name: Cache Built PRoot Binaries (arm64-v8a)
        if: steps.runtime_source.outputs.bootstrap == 'true'
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a
          key: proot-arm64-ndk27.2-${{ hashFiles('scripts/build-proot-android.sh') }}

      - name: Build PRoot + Loader for Android arm64-v8a
        if: steps.runtime_source.outputs.bootstrap == 'true'
        run: ./scripts/build-proot-android.sh

      - name: Cache Embedded Runtime Archives (Debian + OpenVSCode)
        if: steps.runtime_source.outputs.bootstrap == 'true'
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/runtime
          key: runtime-assets-${{ env.OPENVSCODE_VERSION }}-${{ hashFiles('scripts/fetch-runtime-assets.sh') }}

      - name: Fetch Debian Minimal Rootfs & OpenVSCode Server
        if: steps.runtime_source.outputs.bootstrap == 'true'
        run: ./scripts/fetch-runtime-assets.sh

      - name: Lock and materialize runtime assets through the shared consumer
        run: |
          producer="$RUNNER_TEMP/runtime-producer"
          mkdir -p "$producer"
          if [[ -f runtime-assets.lock.json ]]; then
            python3 scripts/runtime-assets.py fetch --lock runtime-assets.lock.json
            cp runtime-assets.lock.json "$producer/runtime-assets.lock.json"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tag="$GITHUB_REF_NAME"
            elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
              tag="v0-runtime-${GITHUB_SHA:0:12}"
            else
              tag="v0-ci-${GITHUB_SHA:0:12}"
            fi
            python3 scripts/runtime-assets.py lock --release "$tag" --output "$producer/runtime-assets.lock.json"
          fi
          for f in libproot.so libproot-loader.so; do
            cp "android/app/src/main/jniLibs/arm64-v8a/$f" "$producer/$f"
            rm "android/app/src/main/jniLibs/arm64-v8a/$f"
          done
          for f in debian-arm64-rootfs.tgz openvscode-server-linux-arm64.tgz debian-manifest.txt; do
            cp "android/app/src/main/assets/runtime/$f" "$producer/$f"
            rm "android/app/src/main/assets/runtime/$f"
          done
          python3 scripts/runtime-assets.py fetch --lock "$producer/runtime-assets.lock.json" --source-dir "$producer" --cache "$RUNNER_TEMP/runtime-consumer-cache"
          python3 scripts/runtime-assets.py verify --lock "$producer/runtime-assets.lock.json"
          echo "KUCODE_RUNTIME_LOCK=$producer/runtime-assets.lock.json" >> "$GITHUB_ENV"

      - name: Upload candidate runtime lock for review
        uses: actions/upload-artifact@v4
        with:
          name: kucode-runtime-lock
          path: ${{ runner.temp }}/runtime-producer/runtime-assets.lock.json
          if-no-files-found: error

      - name: Upload standalone runtime assets for release
        if: steps.runtime_source.outputs.bootstrap == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: kucode-runtime-assets
          path: ${{ runner.temp }}/runtime-producer/*
          if-no-files-found: error
          retention-days: 30

      - name: Exercise extension, ACP & OpenVSCode server flags on the Linux runner
        run: |
          tag="openvscode-server-v${OPENVSCODE_VERSION}"
          archive="$RUNNER_TEMP/${tag}-linux-x64.tar.gz"
          server="$RUNNER_TEMP/kucode-openvscode-linux"
          mkdir -p "$server"
          curl -fsSL --retry 3 "https://github.com/gitpod-io/openvscode-server/releases/download/$tag/$tag-linux-x64.tar.gz" -o "$archive"
          echo "${OPENVSCODE_X64_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$server" --strip-components=1
          rm -f "$archive"
          "$server/node" scripts/guards/run-all-guards.mjs
          "$server/node" --check android/app/src/main/assets/runtime-probes.cjs
          bash -n scripts/probe-android-arm64.sh scripts/aura-language-smoke.sh scripts/aura-self-host-e2e.sh
          "$server/node" --check android/app/src/main/assets/kucode-cli.cjs
          "$server/node" --check android/app/src/main/assets/kucode-android/extension.js
          "$server/node" --test tests/kucode-android.test.cjs tests/agentic-harness.test.cjs
          "$server/node" --check android/app/src/main/assets/kucode-tools/extension.js
          "$server/node" --check android/app/src/main/assets/kucode-tools/acp-client.js
          "$server/node" --check android/app/src/main/assets/kucode-tools/acp-webview.js
          KUCODE_NATIVE_MODULES="$server/node_modules" "$server/node" --test \
            tests/runtime-probes.test.cjs \
            tests/kucode-extension.test.cjs \
            tests/kucode-acp.test.cjs

          # Live smoke test of exact OpenVSCode Server CLI flags & user/Machine + user/logs layout
          smoke_dir="$RUNNER_TEMP/openvscode-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir/user/Machine" "$smoke_dir/extensions" "$smoke_dir/workspace"
          printf '{"chat.disableAIFeatures":true,"security.workspace.trust.enabled":true}\n' > "$smoke_dir/user/Machine/settings.json"
          printf 'kucode-ci-smoke-token\n' > "$smoke_dir/token"
          "$server/bin/openvscode-server" \
            --host 127.0.0.1 \
            --port 19876 \
            --connection-token-file "$smoke_dir/token" \
            --accept-server-license-terms \
            --telemetry-level off \
            --without-browser-env-var \
            --default-folder "$smoke_dir/workspace" \
            --server-data-dir "$smoke_dir" \
            --user-data-dir "$smoke_dir/user" \
            --extensions-dir "$smoke_dir/extensions" \
            > "$smoke_dir/stdout.log" 2>&1 &
          smoke_pid=$!
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:19876/?tkn=kucode-ci-smoke-token" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          kill "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" 2>/dev/null || true
          if [ "$ready" -ne 1 ]; then
            cat "$smoke_dir/stdout.log"
            echo "ERROR: OpenVSCode Server smoke test failed to respond on port 19876" >&2
            exit 1
          fi
          find "$smoke_dir/user/logs" -name 'remoteagent.log' | grep -q 'remoteagent.log'
          rm -rf "$smoke_dir"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Small, Medium & Release Unit Tests and Build Debug + Unsigned Release APKs
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:testDebugMediumUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify Embedded Runtime, 16KB ELF Alignment, Extension & License Notices Inside APKs
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ls -lh "$APK" "$RELEASE_APK"
          for target_apk in "$APK" "$RELEASE_APK"; do
            unzip -p "$target_apk" assets/runtime-probes.cjs | cmp - android/app/src/main/assets/runtime-probes.cjs
            unzip -p "$target_apk" assets/kucode-cli.cjs | cmp - android/app/src/main/assets/kucode-cli.cjs
            unzip -p "$target_apk" assets/kucode-android/extension.js | cmp - android/app/src/main/assets/kucode-android/extension.js
            unzip -p "$target_apk" assets/kucode-android/package.json | cmp - android/app/src/main/assets/kucode-android/package.json
            unzip -p "$target_apk" assets/kucode-tools/extension.js | cmp - android/app/src/main/assets/kucode-tools/extension.js
            unzip -p "$target_apk" assets/kucode-tools/acp-client.js | cmp - android/app/src/main/assets/kucode-tools/acp-client.js
            unzip -p "$target_apk" assets/kucode-tools/acp-webview.js | cmp - android/app/src/main/assets/kucode-tools/acp-webview.js
            unzip -p "$target_apk" assets/kucode-tools/package.json | cmp - android/app/src/main/assets/kucode-tools/package.json
            unzip -p "$target_apk" assets/kucode-tools/icon.svg | cmp - android/app/src/main/assets/kucode-tools/icon.svg
            unzip -l "$target_apk" | grep -q "lib/arm64-v8a/libproot.so"
            unzip -l "$target_apk" | grep -q "lib/arm64-v8a/libproot-loader.so"
            unzip -l "$target_apk" | grep -q "assets/runtime/debian-arm64-rootfs.tgz"
            unzip -l "$target_apk" | grep -q "assets/runtime/openvscode-server-linux-arm64.tgz"
            unzip -l "$target_apk" | grep -q "assets/licenses/LICENSE"
            unzip -l "$target_apk" | grep -q "assets/licenses/THIRD_PARTY_NOTICES.md"
            unzip -l "$target_apk" | grep -q "assets/licenses/MIT-OpenVSCode.txt"
            unzip -l "$target_apk" | grep -q "assets/licenses/Apache-2.0.txt"
            unzip -l "$target_apk" | grep -q "assets/licenses/GPL-2.0.txt"
            unzip -l "$target_apk" | grep -q "assets/licenses/GPL-3.0.txt"
            unzip -l "$target_apk" | grep -q "assets/licenses/LGPL-2.1.txt"
            unzip -l "$target_apk" | grep -q "assets/licenses/LGPL-3.0.txt"
            unzip -l "$target_apk" | grep -q "assets/licenses/debian-manifest.txt"
          done
          unzip -l "$APK" | grep -E "libproot\.so|libproot-loader\.so|debian-arm64-rootfs\.tgz|openvscode-server-linux-arm64\.tgz|boot\.html|assets/kucode-tools/|assets/kucode-android/|assets/licenses/"

          # Verify 16KB ELF LOAD segment alignment for all bundled native libraries
          READELF="$(find "$ANDROID_HOME/ndk" -name llvm-readelf \( -type f -o -type l \) 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$READELF" ] || [ ! -x "$READELF" ]; then
            READELF="$(command -v readelf)"
          fi
          test -x "$READELF"
          echo "Using readelf: $READELF"
          ELF_TMP="$RUNNER_TEMP/apk-elf-check"
          rm -rf "$ELF_TMP" && mkdir -p "$ELF_TMP"
          unzip -j -o "$APK" "lib/arm64-v8a/*.so" -d "$ELF_TMP"
          for elf in "$ELF_TMP"/*.so; do
            "$READELF" -lW "$elf" | python3 -c '
          import sys
          bin_name = sys.argv[1]
          loads = 0
          for line in sys.stdin:
              parts = line.split()
              if parts and parts[0] == "LOAD":
                  loads += 1
                  offset = int(parts[1], 16)
                  vaddr = int(parts[2], 16)
                  align = int(parts[-1], 16)
                  if align < 0x4000 or (offset - vaddr) % 0x4000 != 0:
                      raise SystemExit(f"FAIL: {bin_name} LOAD offset={hex(offset)} vaddr={hex(vaddr)} align={hex(align)}")
          if loads == 0:
              raise SystemExit(f"FAIL: {bin_name} has no LOAD segments")
          print(f"OK 16KB LOAD alignment ({loads} segments): {bin_name}")
          ' "$(basename "$elf")"
          done
          rm -rf "$ELF_TMP"

          mkdir -p dist-apk
          cp "$APK" "dist-apk/kucode-debug.apk"
          cp "android/app/src/main/assets/runtime/debian-manifest.txt" "dist-apk/debian-manifest.txt"
          cp "THIRD_PARTY_NOTICES.md" "dist-apk/THIRD_PARTY_NOTICES.md"
          ls -lh dist-apk/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kucode-debug-apk
          path: dist-apk/kucode-debug.apk
          retention-days: 30

      - name: Upload License Notices & Debian Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kucode-notices
          path: |
            dist-apk/debian-manifest.txt
            dist-apk/THIRD_PARTY_NOTICES.md
          retention-days: 90

      - name: Build Signed Release APK & AAB (when signing secrets are configured)
        id: release_build
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing keystore secret configured; skipping signed release build."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.keystore"
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/kucode-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist-apk/kucode-release.aab
          echo "has_release=true" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Release Artifact
        if: steps.release_build.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kucode-release-bundle
          path: |
            dist-apk/kucode-release.apk
            dist-apk/kucode-release.aab
          retention-days: 90

  runtime-bootstrap:
    name: Publish initial independent runtime assets
    needs: android-apk
    if: github.ref == 'refs/heads/main' && needs.android-apk.outputs.bootstrap_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kucode-runtime-assets
          path: runtime-release-files
      - name: Publish immutable runtime-only prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0-runtime-${GITHUB_SHA:0:12}"
          test "$(jq -r .release runtime-release-files/runtime-assets.lock.json)" = "$tag"
          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
              --title "KuCode runtime assets $tag" \
              --notes "Runtime-only ARM64 artifacts. Review and commit the lock before consuming. Not an APK release."
          fi
          # Publish the lock last. Recover a partially uploaded release on retry,
          # but never replace a published file (including the lock).
          existing="$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          for name in libproot.so libproot-loader.so debian-arm64-rootfs.tgz openvscode-server-linux-arm64.tgz debian-manifest.txt runtime-assets.lock.json; do
            f="runtime-release-files/$name"
            if grep -Fxq "$name" <<< "$existing"; then
              tmp="$(mktemp -d)"
              gh release download "$tag" --repo "$GH_REPO" --pattern "$name" --dir "$tmp"
              cmp "$f" "$tmp/$name"
              rm -rf "$tmp"
            else
              gh release upload "$tag" "$f" --repo "$GH_REPO"
            fi
          done

  release:
    name: Publish GitHub Release
    needs: android-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: kucode-debug-apk
          path: release-files

      - name: Download License Notices & Debian Manifest
        uses: actions/download-artifact@v4
        with:
          name: kucode-notices
          path: release-files

      - name: Download Signed Release Bundle
        if: needs.android-apk.outputs.has_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: kucode-release-bundle
          path: release-files

      - name: Download standalone runtime assets
        if: needs.android-apk.outputs.bootstrap_runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          name: kucode-runtime-assets
          path: runtime-release-files

      - name: Publish GitHub Release on v* tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES=(release-files/debian-manifest.txt release-files/THIRD_PARTY_NOTICES.md)
          if [ -f release-files/kucode-release.apk ]; then
            FILES+=(release-files/kucode-release.apk release-files/kucode-release.aab)
          fi
          FILES+=(release-files/kucode-debug.apk)
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" --title "KuCode $TAG" --generate-notes
          fi
          for f in "${FILES[@]}"; do
            name="$(basename "$f")"
            if gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              tmp="$(mktemp -d)"
              gh release download "$TAG" --repo "$GH_REPO" --pattern "$name" --dir "$tmp"
              cmp "$f" "$tmp/$name"
              rm -rf "$tmp"
            else
              gh release upload "$TAG" "$f" --repo "$GH_REPO"
            fi
          done

      - name: Publish pinned runtime assets (never clobber)
        if: needs.android-apk.outputs.bootstrap_runtime == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # On reruns, accept an identical existing file only. Never overwrite a
          # published asset; consumers pin the reviewed lock from the source tree.
          existing="$(gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          for f in runtime-release-files/*; do
            name="$(basename "$f")"
            # debian-manifest.txt was already published with the APK notices.
            if grep -Fxq "$name" <<< "$existing"; then
              tmp="$(mktemp -d)"
              gh release download "$tag" --repo "$GH_REPO" --pattern "$name" --dir "$tmp"
              cmp "$f" "$tmp/$name"
              rm -rf "$tmp"
            else
              gh release upload "$tag" "$f" --repo "$GH_REPO"
            fi
          done
