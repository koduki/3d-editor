name: CI / CD

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: XR-Editor APK Build (PRoot + Debian + OpenVSCode)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK API 36 Platform & NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          if [[ ! -d "$ANDROID_HOME/ndk" ]] || [[ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]]; then
            "$SDKMANAGER" "ndk;27.2.12479018"
          fi
          ls -la "$ANDROID_HOME/ndk"

      - name: Cache Built PRoot Binaries (arm64-v8a)
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a
          key: proot-arm64-v5.1.107.102-talloc-2.5.0-api34-v1

      - name: Build PRoot + Loader for Android arm64-v8a
        run: ./scripts/build-proot-android.sh

      - name: Cache Embedded Runtime Archives (Debian + OpenVSCode)
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/runtime
          key: runtime-debian12-openvscode-1.109.5-v1

      - name: Fetch Debian Minimal Rootfs & OpenVSCode Server
        run: ./scripts/fetch-runtime-assets.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run Unit Tests & Build Debug APK
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify Embedded Runtime Inside Debug APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "libproot\.so|libproot-loader\.so|debian-arm64-rootfs\.tar\.gz|openvscode-server-linux-arm64\.tar\.gz|boot\.html"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libproot.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libproot-loader.so"
          unzip -l "$APK" | grep -q "assets/runtime/debian-arm64-rootfs.tar.gz"
          unzip -l "$APK" | grep -q "assets/runtime/openvscode-server-linux-arm64.tar.gz"
          mkdir -p dist-apk
          cp "$APK" "dist-apk/xr-editor-debug-${GITHUB_SHA::7}.apk"
          cp "$APK" "dist-apk/xr-editor-debug.apk"
          ls -lh dist-apk/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr-editor-debug-apk
          path: dist-apk/xr-editor-debug*.apk
          retention-days: 30

      - name: Build Signed Release APK & AAB (when signing secrets are configured)
        id: release_build
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing keystore secret configured; skipping signed release build."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" gradle :app:assembleRelease :app:bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.keystore"
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/xr-editor-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist-apk/xr-editor-release.aab
          echo "has_release=true" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Release Artifact
        if: steps.release_build.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xr-editor-release-bundle
          path: |
            dist-apk/xr-editor-release.apk
            dist-apk/xr-editor-release.aab
          retention-days: 90

      - name: Publish GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES=(dist-apk/xr-editor-debug.apk)
          if [ -f dist-apk/xr-editor-release.apk ]; then
            FILES+=(dist-apk/xr-editor-release.apk dist-apk/xr-editor-release.aab)
          fi
          gh release create "$TAG" "${FILES[@]}" \
            --title "XR-Editor $TAG" \
            --generate-notes || \
          gh release upload "$TAG" "${FILES[@]}" --clobber
